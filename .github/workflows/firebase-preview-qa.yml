name: Deploy to QA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'
        type: string
      deploy_backend:
        description: 'Deploy backend to Cloud Run'
        required: false
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy frontend to Firebase Hosting'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-south2
  SERVICE_NAME: legal-terminus-qa
  GAR_REPO: legal-terminus-qa
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Authenticate ────────────────────────────────────────────────────────
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.QA_WIF_PROVIDER }}
          service_account: ${{ secrets.QA_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Build & Deploy Frontend → Firebase Hosting ─────────────────────────
      - name: Install Frontend dependencies
        if: github.event.inputs.deploy_frontend == 'true' || github.event_name == 'push'
        run: npm ci
        working-directory: Frontend

      - name: Build Frontend
        if: github.event.inputs.deploy_frontend == 'true' || github.event_name == 'push'
        run: npm run build
        working-directory: Frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_QA_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_QA_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_QA_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_QA_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_QA_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_QA_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_QA_MEASUREMENT_ID }}
          VITE_API_BASE_URL: https://${{ secrets.FIREBASE_QA_PROJECT_ID }}.web.app

      - name: 🔥 Install Firebase CLI
        if: github.event.inputs.deploy_frontend == 'true' || github.event_name == 'push'
        run: npm install -g firebase-tools

      - name: 🌐 Deploy Frontend to Firebase Hosting
        if: github.event.inputs.deploy_frontend == 'true' || github.event_name == 'push'
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          firebase deploy --only hosting \
            --project=${{ secrets.FIREBASE_QA_PROJECT_ID }} \
            --token="$ACCESS_TOKEN"

      # ── Build & Deploy Backend → Cloud Run ─────────────────────────────────
      - name: Set up Docker Buildx
        if: github.event.inputs.deploy_backend == 'true' || github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Google Artifact Registry
        if: github.event.inputs.deploy_backend == 'true' || github.event_name == 'push'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        if: github.event.inputs.deploy_backend == 'true' || github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.FIREBASE_QA_PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ secrets.FIREBASE_QA_PROJECT_ID }}/${{ env.GAR_REPO }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ secrets.FIREBASE_QA_PROJECT_ID }}/${{ env.GAR_REPO }}/backend:buildcache,mode=max

      - name: 🚀 Deploy to Cloud Run
        if: github.event.inputs.deploy_backend == 'true' || github.event_name == 'push'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.FIREBASE_QA_PROJECT_ID }}/${{ env.GAR_REPO }}/backend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=5 \
            --memory=512Mi \
            --cpu=1 \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="FIREBASE_PROJECT_ID=${{ secrets.BACKEND_FIREBASE_PROJECT_ID }}" \
            --set-env-vars="FIREBASE_PRIVATE_KEY_ID=${{ secrets.BACKEND_FIREBASE_PRIVATE_KEY_ID }}" \
            --set-env-vars="FIREBASE_CLIENT_EMAIL=${{ secrets.BACKEND_FIREBASE_CLIENT_EMAIL }}" \
            --set-env-vars="FIREBASE_CLIENT_ID=${{ secrets.BACKEND_FIREBASE_CLIENT_ID }}" \
            --set-env-vars="FIREBASE_CLIENT_CERT_URL=${{ secrets.BACKEND_FIREBASE_CLIENT_CERT_URL }}" \
            --set-env-vars="^||^FIREBASE_PRIVATE_KEY=${{ secrets.BACKEND_FIREBASE_PRIVATE_KEY }}" \
            --project=${{ secrets.FIREBASE_QA_PROJECT_ID }}

          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ secrets.FIREBASE_QA_PROJECT_ID }} \
            --format='value(status.url)')
          echo "✅ Backend live at: $URL"


