# E24-S00 — builds the QA images. Run from the repo root on the `qa` branch:
#   scripts/deploy-qa.sh
# QA has no CI on purpose: it is a temporary environment, deployed by hand.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REPO}/backend-qa:${_TAG}', '-f', 'Dockerfile', '.']
  - name: gcr.io/cloud-builders/docker
    # Portal.Dockerfile writes files with a heredoc, which needs BuildKit.
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - -t
      - ${_REPO}/portal-qa:${_TAG}
      - -f
      - Portal.Dockerfile
      - --build-arg=VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - --build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - --build-arg=VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - --build-arg=VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}
      - --build-arg=VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - --build-arg=VITE_API_BASE_URL=${_SITE_URL}
      - --build-arg=VITE_FIRESTORE_DATABASE_ID=${_DATABASE_ID}
      - .
images:
  - ${_REPO}/backend-qa:${_TAG}
  - ${_REPO}/portal-qa:${_TAG}
timeout: 1800s
