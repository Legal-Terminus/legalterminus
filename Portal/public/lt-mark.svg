<!--
  Legal Terminus "L⌐" mark (#110).

  Hand-vectorised from the official raster mark rather than auto-traced: the
  glyph is pure axis-aligned rectangles, so these coordinates are EXACT, not an
  approximation. Measured off the 100x100 brand favicon, expressed on a 0 0 100
  100 viewBox so the numbers map 1:1 to that source.

  Brand green is #27B811 (sampled from the official asset).

  Dark elements are an explicit near-black: a favicon renders on browser chrome
  we do not control, where `currentColor` resolves unpredictably. The in-app
  component (src/components/common/LTLogo.tsx) uses currentColor instead, so it
  can render white on the dark sidebar and login panel.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 16 57 67" width="57" height="67" role="img" aria-label="Legal Terminus">
  <!-- Top rules: left dark tick, green tick, long dark rule -->
  <rect x="22" y="18" width="13" height="6" fill="#111111"/>
  <rect x="37" y="18" width="14" height="6" fill="#27B811"/>
  <rect x="54" y="18" width="21" height="6" fill="#111111"/>

  <!-- Verticals: green outer + inner (the "L"), dark stem (the "⌐") -->
  <rect x="37" y="18" width="6" height="62" fill="#27B811"/>
  <rect x="46" y="24" width="5" height="47" fill="#27B811"/>
  <rect x="54" y="18" width="6" height="53" fill="#111111"/>

  <!-- Foot of the L -->
  <rect x="37" y="75" width="38" height="6" fill="#27B811"/>
</svg>
