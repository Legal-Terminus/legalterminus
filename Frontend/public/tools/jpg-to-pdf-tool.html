<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<html lang="en">
<head>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .btn:hover:not(:disabled) { background: #1E7E34; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3); }
        .btn:disabled { background: #6C757D; cursor: not-allowed; opacity: 0.6; }
        .btn-secondary { background: #6C757D; }

        .btn-danger { background: #DC3545; }

        .btn-warning { background: #FFC107; color: #212529; }

        .file-preview img { width: 100%; height: 100%; object-fit: cover; }
        .progress-bar { width: 100%; height: 4px; background: #E9ECEF; border-radius: 2px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: #28A745; width: 0%; transition: width 0.3s ease; }
        .alert { padding: 15px; margin-bottom: 20px; border-radius: 5px; font-weight: 500; }
        .alert-success { background: #D4EDDA; color: #155724; border: 1px solid #C3E6CB; }
        .alert-error { background: #F8D7DA; color: #721C24; border: 1px solid #F5C6CB; }
        .alert-info { background: #D1ECF1; color: #0C5460; border: 1px solid #BEE5EB; }
    </style>
</head>
<body>
    <div class="pdf-converter-container" role="main">
        <header class="header">
            <h1>JPG to PDF</h1>
            <p>Upload JPG or PNG images and convert them to a single PDF</p>
        </header>
        
        <div id="alertContainer"></div>
        
        <section class="upload-section" aria-label="Upload image files">
            <div class="upload-area" id="uploadArea" role="button" tabindex="0" aria-label="Click or drag files here to upload">
                <div class="upload-icon">📷</div>
                <h2>Upload JPG/PNG Files</h2>
                <p>Drag & Drop JPG/PNG files here or Click to Upload</p>
                <p style="color: #6C757D; font-size: 0.9rem; margin-top: 10px;">Maximum file size: 10MB per file</p>
                <input type="file" id="fileInput" class="file-input" accept="image/jpeg,image/png,image/jpg" multiple aria-label="Select JPG or PNG files">
                <button class="btn" id="selectFilesBtn" style="margin-top: 20px;">Select Files</button>
            </div>
        </section>
        
        <section class="files-section" id="filesSection" aria-label="Uploaded files list">
            <div class="files-header">
                <h2>Uploaded Files (<span id="fileCount">0</span>)</h2>
                <div class="bulk-actions">
                    <button class="btn btn-warning" id="convertAllBtn" aria-label="Convert all files to PDF">Convert All to PDF</button>
                    <button class="btn btn-secondary" id="clearAllBtn" aria-label="Clear all files">Clear All</button>
                </div>
            </div>
            <ul class="files-list" id="filesList" role="list" aria-label="Image files to convert"></ul>
        </section>
        
        <section id="downloadSection" style="display: none; text-align: center; margin-top: 20px;">
            <button class="btn btn-info" id="downloadPdfBtn" aria-label="Download PDF">Download PDF</button>
        </section>
    </div>
    
    <!-- PDF-LIB.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    
    <script>
        let uploadedFiles = [];
        let fileIdCounter = 0;
        let pdfDoc = null;
        let isConverted = false;
        let draggedItem = null;
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const filesSection = document.getElementById('filesSection');
        const filesList = document.getElementById('filesList');
        const fileCount = document.getElementById('fileCount');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const convertAllBtn = document.getElementById('convertAllBtn');
        const selectFilesBtn = document.getElementById('selectFilesBtn');
        const alertContainer = document.getElementById('alertContainer');
        const downloadSection = document.getElementById('downloadSection');
        const downloadPdfBtn = document.getElementById('downloadPdfBtn');
        
        function initializeEventListeners() {
            selectFilesBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                fileInput.click();
            });
            
            uploadArea.addEventListener('click', (e) => {
                if (e.target !== selectFilesBtn) {
                    fileInput.click();
                }
            });
            
            fileInput.addEventListener('change', handleFileSelect);
            
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', handleDrop);
            
            document.addEventListener('dragover', (e) => e.preventDefault());
            document.addEventListener('drop', (e) => e.preventDefault());
            
            clearAllBtn.addEventListener('click', clearAllFiles);
            convertAllBtn.addEventListener('click', convertAllFiles);
            downloadPdfBtn.addEventListener('click', downloadPdf);
            
            filesList.addEventListener('dragstart', handleDragStart);
            filesList.addEventListener('dragover', handleDragOver);
            filesList.addEventListener('drop', handleDragDrop);
            filesList.addEventListener('dragend', handleDragEnd);
        }
        
        function showAlert(message, type = 'info') {
            const alert = document.createElement('div');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
            setTimeout(() => {
                if (alertContainer.contains(alert)) {
                    alertContainer.removeChild(alert);
                }
            }, 5000);
        }
        
        async function generateImagePreview(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxWidth = 60;
                        const maxHeight = 60;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width *= maxHeight / height;
                                height = maxHeight;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg'));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
        
        async function handleFileSelect(e) {
            await processFiles(Array.from(e.target.files));
            e.target.value = '';
        }
        
        async function handleDrop(e) {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            await processFiles(Array.from(e.dataTransfer.files));
        }
        
        async function processFiles(files) {
            if (files.length === 0) return;
            
            const validFiles = files.filter(file => {
                const validTypes = ['image/jpeg', 'image/jpg', 'image/png'];
                return validTypes.includes(file.type.toLowerCase());
            });
            
            if (validFiles.length === 0) {
                showAlert('Please select valid JPG or PNG image files.', 'error');
                return;
            }
            
            for (const file of validFiles) {
                const existingFile = uploadedFiles.find(f => f.name === file.name && f.size === file.size);
                if (existingFile) {
                    showAlert(`File "${file.name}" is already uploaded.`, 'info');
                    continue;
                }
                
                if (file.size <= 10 * 1024 * 1024) {
                    const previewUrl = await generateImagePreview(file);
                    uploadedFiles.push({
                        id: fileIdCounter++,
                        file: file,
                        name: file.name,
                        size: file.size,
                        status: 'ready',
                        preview: previewUrl
                    });
                } else {
                    showAlert(`File "${file.name}" exceeds 10MB and was skipped.`, 'error');
                }
            }
            
            updateFilesList();
            
            if (validFiles.length > 0) {
                showAlert(`${validFiles.length} file(s) uploaded successfully!`, 'success');
            }
        }
        
        function updateFilesList() {
            filesList.innerHTML = '';
            
            uploadedFiles.forEach(fileObj => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.dataset.fileId = fileObj.id;
                li.draggable = true;
                
                li.innerHTML = `
                    <div class="file-preview">
                        <img src="${fileObj.preview}" alt="Preview of ${fileObj.name}">
                    </div>
                    <div class="file-info">
                        <div class="file-name">${fileObj.name}</div>
                        <div class="file-size">${(fileObj.size / 1024).toFixed(2)} KB</div>
                        <div class="file-status ${fileObj.status}" id="status-${fileObj.id}">
                            ${fileObj.status === 'ready' ? 'Ready for conversion' : fileObj.status}
                        </div>
                    </div>
                    <div class="file-actions" id="actions-${fileObj.id}">
                        <button class="btn btn-danger" onclick="removeFile(${fileObj.id})">Remove</button>
                    </div>
                `;
                
                filesList.appendChild(li);
            });
            
            fileCount.textContent = uploadedFiles.length;
            filesSection.classList.toggle('active', uploadedFiles.length > 0);
            downloadSection.style.display = (isConverted && pdfDoc) ? 'block' : 'none';
        }
        
        function handleDragStart(e) {
            if (e.target.classList.contains('file-item')) {
                draggedItem = e.target;
                e.target.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', e.target.dataset.fileId);
            }
        }
        
        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.file-item');
            if (target && target !== draggedItem) {
                const allItems = [...filesList.querySelectorAll('.file-item')];
                const draggedIndex = allItems.indexOf(draggedItem);
                const targetIndex = allItems.indexOf(target);
                if (draggedIndex < targetIndex) {
                    target.after(draggedItem);
                } else {
                    target.before(draggedItem);
                }
                const draggedFile = uploadedFiles.find(f => f.id === parseInt(draggedItem.dataset.fileId));
                uploadedFiles = uploadedFiles.filter(f => f.id !== parseInt(draggedItem.dataset.fileId));
                uploadedFiles.splice(targetIndex, 0, draggedFile);
            }
        }
        
        function handleDragDrop(e) {
            e.preventDefault();
            if (draggedItem) {
                draggedItem.classList.remove('dragging');
                draggedItem = null;
                isConverted = false;
                downloadSection.style.display = 'none';
                showAlert('File order updated. Please convert again.', 'info');
            }
        }
        
        function handleDragEnd(e) {
            if (draggedItem) {
                draggedItem.classList.remove('dragging');
                draggedItem = null;
            }
        }
        
        async function convertAllFiles() {
            if (uploadedFiles.length === 0) {
                showAlert('No files to convert.', 'error');
                return;
            }
            
            if (typeof PDFLib === 'undefined' || !PDFLib.PDFDocument) {
                showAlert('PDF library is still loading. Please wait a moment and try again.', 'error');
                return;
            }
            
            convertAllBtn.disabled = true;
            convertAllBtn.textContent = 'Converting...';
            
            isConverted = false;
            downloadSection.style.display = 'none';
            
            uploadedFiles.forEach(fileObj => {
                fileObj.status = 'converting';
            });
            updateFilesList();
            
            try {
                const { PDFDocument, rgb } = PDFLib;
                pdfDoc = await PDFDocument.create();
                
                for (let i = 0; i < uploadedFiles.length; i++) {
                    const fileObj = uploadedFiles[i];
                    
                    try {
                        console.log(`Processing file ${i + 1}/${uploadedFiles.length}: ${fileObj.name}`);
                        
                        const arrayBuffer = await fileObj.file.arrayBuffer();
                        let img;
                        
                        if (fileObj.file.type.toLowerCase() === 'image/png') {
                            img = await pdfDoc.embedPng(arrayBuffer);
                        } else {
                            img = await pdfDoc.embedJpg(arrayBuffer);
                        }
                        
                        const page = pdfDoc.addPage();
                        const { width, height } = img.scale(1);
                        const pageWidth = page.getWidth();
                        const pageHeight = page.getHeight();
                        
                        const scale = Math.min(pageWidth / width, pageHeight / height, 1);
                        const scaledWidth = width * scale;
                        const scaledHeight = height * scale;
                        
                        page.drawImage(img, {
                            x: (pageWidth - scaledWidth) / 2,
                            y: (pageHeight - scaledHeight) / 2,
                            width: scaledWidth,
                            height: scaledHeight
                        });
                        
                        fileObj.status = 'converted';
                        updateFilesList();
                        
                        console.log(`Successfully processed: ${fileObj.name}`);
                        
                        await new Promise(resolve => setTimeout(resolve, 100));
                        
                    } catch (error) {
                        console.error(`Error converting ${fileObj.name}:`, error);
                        fileObj.status = 'error';
                        updateFilesList();
                    }
                }
                
                console.log(`Conversion complete. Total pages in PDF: ${pdfDoc.getPages().length}`);
                
                const convertedFiles = uploadedFiles.filter(f => f.status === 'converted');
                const errorFiles = uploadedFiles.filter(f => f.status === 'error');
                
                if (convertedFiles.length > 0) {
                    isConverted = true;
                    downloadSection.style.display = 'block';
                    
                    if (errorFiles.length > 0) {
                        showAlert(`${convertedFiles.length} files converted successfully. ${errorFiles.length} files failed.`, 'info');
                    } else {
                        showAlert('All files converted successfully!', 'success');
                    }
                } else {
                    showAlert('All files failed to convert. Please try again.', 'error');
                }
                
            } catch (error) {
                console.error('PDF conversion error:', error);
                uploadedFiles.forEach(fileObj => {
                    if (fileObj.status === 'converting') {
                        fileObj.status = 'error';
                    }
                });
                updateFilesList();
                showAlert(`Error converting files: ${error.message}`, 'error');
            } finally {
                convertAllBtn.disabled = false;
                convertAllBtn.textContent = 'Convert All to PDF';
            }
        }
        
        async function downloadPdf() {
            if (!pdfDoc || !isConverted) {
                showAlert('No PDF available to download.', 'error');
                return;
            }
            
            try {
                downloadPdfBtn.disabled = true;
                downloadPdfBtn.textContent = 'Preparing download...';
                
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `converted_images_${new Date().getTime()}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showAlert('PDF downloaded successfully!', 'success');
                
            } catch (error) {
                console.error('Download error:', error);
                showAlert('Error downloading PDF. Please try again.', 'error');
            } finally {
                downloadPdfBtn.disabled = false;
                downloadPdfBtn.textContent = 'Download PDF';
            }
        }
        
        function removeFile(fileId) {
            uploadedFiles = uploadedFiles.filter(f => f.id !== fileId);
            updateFilesList();
            
            if (uploadedFiles.length === 0) {
                pdfDoc = null;
                isConverted = false;
            }
        }
        
        function clearAllFiles() {
            uploadedFiles = [];
            pdfDoc = null;
            isConverted = false;
            updateFilesList();
            showAlert('All files cleared.', 'info');
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            initializeEventListeners();
            
            if (typeof PDFLib === 'undefined' || !PDFLib.PDFDocument) {
                setTimeout(() => {
                    if (typeof PDFLib === 'undefined' || !PDFLib.PDFDocument) {
                        showAlert('PDF library failed to load. Please refresh the page.', 'error');
                    }
                }, 3000);
            }
        });
    </script>
