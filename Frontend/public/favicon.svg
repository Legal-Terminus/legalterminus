<!--
  Legal Terminus "L⌐" mark (#110).

  Replaces a hand-drawn approximation that used the WRONG green (#22c55e, a
  Tailwind default, rather than the brand's #27B811), added strokes the logo does
  not have, drew three tick marks instead of the correct bars, and included a
  decorative dot that does not exist in the logo. That divergence between the
  marketing site and the portal is exactly what #110 reports.

  These coordinates are measured from the official 100x100 brand favicon — the
  glyph is pure axis-aligned rectangles, so this is exact, not auto-traced.

  A favicon renders on unknown chrome, so the dark elements are an explicit
  near-black rather than currentColor (which would resolve unpredictably here).
  The in-app component uses currentColor so it can go white on dark surfaces.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 16 57 67" width="57" height="67" role="img" aria-label="Legal Terminus">
  <rect x="22" y="18" width="13" height="6" fill="#111111"/>
  <rect x="37" y="18" width="14" height="6" fill="#27B811"/>
  <rect x="54" y="18" width="21" height="6" fill="#111111"/>
  <rect x="37" y="18" width="6" height="62" fill="#27B811"/>
  <rect x="46" y="24" width="5" height="47" fill="#27B811"/>
  <rect x="54" y="18" width="6" height="53" fill="#111111"/>
  <rect x="37" y="75" width="38" height="6" fill="#27B811"/>
</svg>
