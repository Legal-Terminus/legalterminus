<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Legal Terminus</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .card {
      display: flex;
      width: min(960px, 96vw);
      min-height: 580px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.14);
    }

    /* ── LEFT: form panel ── */
    .form-panel {
      flex: 1 1 50%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 56px 52px;
    }

    .form-panel h1 {
      font-size: 28px;
      font-weight: 700;
      color: #0f1724;
      margin-bottom: 6px;
      letter-spacing: -.3px;
    }

    .form-panel .sub {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 36px;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 9px;
      font-size: 14px;
      color: #111827;
      outline: none;
      transition: border-color .2s;
      background: #fff;
    }

    .field input::placeholder { color: #9ca3af; }

    .field input:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.12); }

    .pw-wrap { position: relative; }

    .pw-wrap input { padding-right: 44px; }

    .eye-btn {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      transition: color .2s;
    }

    .eye-btn:hover { color: #16a34a; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      user-select: none;
    }

    .remember input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #16a34a;
      cursor: pointer;
    }

    .forgot {
      font-size: 13px;
      font-weight: 600;
      color: #16a34a;
      text-decoration: none;
    }

    .forgot:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      height: 48px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .3px;
      transition: background .2s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover { background: #15803d; }
    .btn-login:active { transform: scale(.985); }

    .signup-row {
      margin-top: 22px;
      text-align: center;
      font-size: 13.5px;
      color: #6b7280;
    }

    .signup-row a {
      color: #16a34a;
      font-weight: 700;
      text-decoration: none;
    }

    .signup-row a:hover { text-decoration: underline; }

    /* ── login error box ── */
    .login-error {
      display: none;
      align-items: flex-start;
      gap: 9px;
      background: #fef2f2;
      border: 1.5px solid #fca5a5;
      border-radius: 9px;
      padding: 10px 14px;
      margin-bottom: 16px;
      color: #dc2626;
      font-size: 13px;
      line-height: 1.5;
    }
    .login-error.show { display: flex; }
    .login-error svg { flex-shrink: 0; margin-top: 1px; }

    /* ── field error highlight ── */
    .field input.input-err { border-color: #ef4444 !important; }

    /* ── shake animation ── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      40%      { transform: translateX(7px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .shake { animation: shake 0.38s ease; }

    /* ── RIGHT: brand panel ── */
    .brand-panel {
      flex: 1 1 50%;
      background: linear-gradient(145deg, #16a34a 0%, #15803d 55%, #166534 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 44px;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    /* decorative circles */
    .brand-panel::before {
      content: '';
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      top: -110px;
      right: -110px;
    }

    .brand-panel::after {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      bottom: -70px;
      left: -60px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 48px;
      z-index: 1;
    }

    .logo-gif {
      height: 60px;
      width: auto;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,.18));
      display: block;
    }

    /* illustration card */
    .illus-card {
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 18px;
      padding: 32px 28px 28px;
      width: 100%;
      max-width: 320px;
      z-index: 1;
      margin-bottom: 32px;
    }

    .illus-card svg { display: block; margin: 0 auto 18px; }

    .illus-card h2 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .illus-card p {
      font-size: 13px;
      text-align: center;
      opacity: .8;
      line-height: 1.6;
    }

    /* dots */
    .dots {
      display: flex;
      gap: 8px;
      z-index: 1;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
    }

    .dot.active {
      width: 26px;
      border-radius: 5px;
      background: #fff;
    }

    /* ── responsive ── */
    @media (max-width: 640px) {
      .card { flex-direction: column; min-height: unset; }
      .brand-panel { padding: 36px 28px; min-height: 240px; }
      .form-panel { padding: 36px 28px; }
      .illus-card { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- ── LEFT: login form ── -->
  <div class="form-panel">
    <h1>Welcome Back!</h1>
    <p class="sub">Please enter your details to continue</p>

    <!-- login error -->
    <div class="login-error" id="loginError">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="loginErrorMsg">Incorrect email or password. Please try again.</span>
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter Your Email" autocomplete="email" oninput="clearError()" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Enter Password" autocomplete="current-password" oninput="clearError()" />
        <button class="eye-btn" type="button" onclick="togglePw()" aria-label="Toggle password visibility" id="eyeBtn">
          <!-- eye icon (visible) -->
          <svg id="iconShow" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- eye-off icon (hidden) -->
          <svg id="iconHide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="row">
      <label class="remember">
        <input type="checkbox" /> Remember Me
      </label>
      <a href="/forgot-password.html" class="forgot">Forgot Password?</a>
    </div>

    <button class="btn-login" type="button" onclick="handleLogin()">
      Login
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>

    <p class="signup-row">Don't have an account? <a href="/signup.html">Sign Up</a></p>
  </div>

  <!-- ── RIGHT: brand panel ── -->
  <div class="brand-panel">
    <!-- animated logo -->
    <div class="logo-area">
      <img
        class="logo-gif"
        src="/logo-animated.gif"
        onerror="this.src='https://legalterminus.com/wp-content/uploads/2023/09/Legal-Terminus-LOGO-GIF_300-x-150.gif'"
        alt="Legal Terminus"
      />
    </div>

    <!-- illustration card -->
    <div class="illus-card">
      <!-- person + clipboard illustration -->
      <svg xmlns="http://www.w3.org/2000/svg" width="190" height="150" viewBox="0 0 190 150">

        <!-- scatter dots -->
        <circle cx="12"  cy="20"  r="3"   fill="rgba(255,255,255,0.35)"/>
        <circle cx="178" cy="30"  r="2.5" fill="rgba(255,255,255,0.30)"/>
        <circle cx="8"   cy="110" r="2"   fill="rgba(255,255,255,0.25)"/>
        <circle cx="170" cy="120" r="2"   fill="rgba(255,255,255,0.25)"/>
        <circle cx="90"  cy="8"   r="2"   fill="rgba(255,255,255,0.20)"/>

        <!-- ── clipboard ── -->
        <!-- board body -->
        <rect x="18" y="28" width="82" height="106" rx="10" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.50)" stroke-width="1.8"/>
        <!-- clip -->
        <rect x="44" y="20" width="30" height="16" rx="8" fill="rgba(255,255,255,0.45)"/>
        <rect x="50" y="24" width="18" height="8"  rx="4" fill="rgba(255,255,255,0.20)"/>
        <!-- form row 1 -->
        <rect x="30" y="52" width="58" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
        <!-- form row 2 (highlighted / active field) -->
        <rect x="30" y="68" width="58" height="8" rx="4" fill="rgba(255,255,255,0.55)" stroke="rgba(255,255,255,0.80)" stroke-width="1"/>
        <rect x="35" y="71" width="28" height="2" rx="1" fill="rgba(22,101,52,0.30)"/>
        <!-- form row 3 -->
        <rect x="30" y="84" width="58" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
        <!-- submit button on clipboard -->
        <rect x="30" y="100" width="38" height="13" rx="6" fill="rgba(255,255,255,0.60)"/>
        <rect x="37" y="104" width="24" height="5" rx="2.5" fill="rgba(22,101,52,0.35)"/>

        <!-- ── checkmark badge (top-right) ── -->
        <circle cx="158" cy="32" r="20" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.50)" stroke-width="1.5"/>
        <circle cx="158" cy="32" r="14" fill="rgba(255,255,255,0.30)"/>
        <polyline points="149,32 155,39 168,24" stroke="rgba(255,255,255,0.95)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- ── person (standing right, pointing at clipboard) ── -->
        <!-- head -->
        <circle cx="148" cy="72" r="14" fill="rgba(255,255,255,0.65)"/>
        <!-- hair cap -->
        <path d="M135 70 Q137 57 148 58 Q159 57 161 70" fill="rgba(255,255,255,0.38)"/>
        <!-- eyes -->
        <circle cx="143" cy="71" r="2"   fill="rgba(22,101,52,0.55)"/>
        <circle cx="153" cy="71" r="2"   fill="rgba(22,101,52,0.55)"/>
        <!-- smile -->
        <path d="M143 77 Q148 82 153 77" stroke="rgba(22,101,52,0.50)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- neck -->
        <rect x="144" y="85" width="8" height="8" rx="3" fill="rgba(255,255,255,0.55)"/>
        <!-- torso -->
        <rect x="132" y="93" width="32" height="34" rx="8" fill="rgba(255,255,255,0.38)"/>
        <!-- left arm pointing at clipboard -->
        <path d="M132 100 Q110 102 100 98" stroke="rgba(255,255,255,0.70)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <!-- pointing hand -->
        <circle cx="97" cy="97" r="5" fill="rgba(255,255,255,0.60)"/>
        <!-- right arm down -->
        <path d="M164 100 Q170 110 168 122" stroke="rgba(255,255,255,0.60)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <!-- legs -->
        <path d="M140 127 Q139 138 138 146" stroke="rgba(255,255,255,0.55)" stroke-width="8" stroke-linecap="round"/>
        <path d="M156 127 Q157 138 158 146" stroke="rgba(255,255,255,0.55)" stroke-width="8" stroke-linecap="round"/>
        <!-- shoes -->
        <ellipse cx="137" cy="147" rx="8" ry="4" fill="rgba(255,255,255,0.35)"/>
        <ellipse cx="159" cy="147" rx="8" ry="4" fill="rgba(255,255,255,0.35)"/>
      </svg>

      <h2>Trusted Legal Services at Your Fingertips</h2>
      <p>Instant registrations, filings &amp; compliance — trusted by thousands of businesses across India.</p>
    </div>

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

</div>

<script>
  /* ── toggle password visibility ── */
  function togglePw() {
    const input = document.getElementById('password');
    const show  = document.getElementById('iconShow');
    const hide  = document.getElementById('iconHide');
    if (input.type === 'password') {
      input.type = 'text';
      show.style.display = 'none';
      hide.style.display = 'block';
    } else {
      input.type = 'password';
      show.style.display = 'block';
      hide.style.display = 'none';
    }
  }

  /* ── show / clear error ── */
  function showError(msg) {
    const box = document.getElementById('loginError');
    document.getElementById('loginErrorMsg').textContent = msg;
    box.classList.add('show');

    /* shake both inputs */
    ['email','password'].forEach(id => {
      const el = document.getElementById(id);
      el.classList.add('input-err', 'shake');
      el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
    });
  }

  function clearError() {
    document.getElementById('loginError').classList.remove('show');
    ['email','password'].forEach(id =>
      document.getElementById(id).classList.remove('input-err')
    );
  }

  /* ── login handler ── */
  function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const pw    = document.getElementById('password').value;

    if (!email && !pw) {
      showError('Please enter your email address and password.');
      return;
    }
    if (!email) {
      showError('Please enter your email address.');
      return;
    }
    if (!/\S+@\S+\.\S+/.test(email)) {
      showError('Please enter a valid email address.');
      return;
    }
    if (!pw) {
      showError('Please enter your password.');
      return;
    }

    /* ── simulate authentication ──
       Replace this block with your real API call.
       Any email/password that doesn't match the demo
       credentials triggers the wrong-password error.   ── */
    const DEMO_EMAIL = 'admin@legalterminus.com';
    const DEMO_PW    = 'Admin@123';

    if (email !== DEMO_EMAIL || pw !== DEMO_PW) {
      showError('Incorrect email or password. Please try again.');
      return;
    }

    /* success — redirect or proceed */
    alert('Login successful! Welcome back.');
  }
</script>

</body>
</html>
