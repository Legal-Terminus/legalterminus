<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Legal Terminus</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .card {
      display: flex;
      width: min(960px, 96vw);
      min-height: 580px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.14);
    }

    /* ── LEFT: form panel ── */
    .form-panel {
      flex: 1 1 50%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 56px 52px;
    }

    .form-panel h1 {
      font-size: 28px;
      font-weight: 700;
      color: #0f1724;
      margin-bottom: 6px;
      letter-spacing: -.3px;
    }

    .form-panel .sub {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 36px;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 9px;
      font-size: 14px;
      color: #111827;
      outline: none;
      transition: border-color .2s;
      background: #fff;
    }

    .field input::placeholder { color: #9ca3af; }

    .field input:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.12); }

    .pw-wrap { position: relative; }

    .pw-wrap input { padding-right: 44px; }

    .eye-btn {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      transition: color .2s;
    }

    .eye-btn:hover { color: #16a34a; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      user-select: none;
    }

    .remember input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #16a34a;
      cursor: pointer;
    }

    .forgot {
      font-size: 13px;
      font-weight: 600;
      color: #16a34a;
      text-decoration: none;
    }

    .forgot:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      height: 48px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .3px;
      transition: background .2s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover { background: #15803d; }
    .btn-login:active { transform: scale(.985); }

    .signup-row {
      margin-top: 22px;
      text-align: center;
      font-size: 13.5px;
      color: #6b7280;
    }

    .signup-row a {
      color: #16a34a;
      font-weight: 700;
      text-decoration: none;
    }

    .signup-row a:hover { text-decoration: underline; }

    /* ── RIGHT: brand panel ── */
    .brand-panel {
      flex: 1 1 50%;
      background: linear-gradient(145deg, #16a34a 0%, #15803d 55%, #166534 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 44px;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    /* decorative circles */
    .brand-panel::before {
      content: '';
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      top: -110px;
      right: -110px;
    }

    .brand-panel::after {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      bottom: -70px;
      left: -60px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 48px;
      z-index: 1;
    }

    .logo-gif {
      height: 60px;
      width: auto;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,.18));
      display: block;
    }

    /* illustration card */
    .illus-card {
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 18px;
      padding: 32px 28px 28px;
      width: 100%;
      max-width: 320px;
      z-index: 1;
      margin-bottom: 32px;
    }

    .illus-card svg { display: block; margin: 0 auto 18px; }

    .illus-card h2 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .illus-card p {
      font-size: 13px;
      text-align: center;
      opacity: .8;
      line-height: 1.6;
    }

    /* dots */
    .dots {
      display: flex;
      gap: 8px;
      z-index: 1;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
    }

    .dot.active {
      width: 26px;
      border-radius: 5px;
      background: #fff;
    }

    /* ── responsive ── */
    @media (max-width: 640px) {
      .card { flex-direction: column; min-height: unset; }
      .brand-panel { padding: 36px 28px; min-height: 240px; }
      .form-panel { padding: 36px 28px; }
      .illus-card { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- ── LEFT: login form ── -->
  <div class="form-panel">
    <h1>Welcome Back!</h1>
    <p class="sub">Please enter your details to continue</p>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter Your Email" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Enter Password" autocomplete="current-password" />
        <button class="eye-btn" type="button" onclick="togglePw()" aria-label="Toggle password visibility" id="eyeBtn">
          <!-- eye icon (visible) -->
          <svg id="iconShow" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- eye-off icon (hidden) -->
          <svg id="iconHide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="row">
      <label class="remember">
        <input type="checkbox" /> Remember Me
      </label>
      <a href="#" class="forgot">Forgot Password?</a>
    </div>

    <button class="btn-login" type="button">
      Login
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>

    <p class="signup-row">Don't have an account? <a href="#">Sign Up</a></p>
  </div>

  <!-- ── RIGHT: brand panel ── -->
  <div class="brand-panel">
    <!-- animated logo -->
    <div class="logo-area">
      <img
        class="logo-gif"
        src="/logo-animated.gif"
        onerror="this.src='https://legalterminus.com/wp-content/uploads/2023/09/Legal-Terminus-LOGO-GIF_300-x-150.gif'"
        alt="Legal Terminus"
      />
    </div>

    <!-- illustration card -->
    <div class="illus-card">
      <!-- person with laptop illustration -->
      <svg xmlns="http://www.w3.org/2000/svg" width="180" height="145" viewBox="0 0 180 145">
        <defs>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
        </defs>

        <!-- glow circle behind person -->
        <ellipse cx="90" cy="95" rx="55" ry="40" fill="url(#glow)"/>

        <!-- ── desk / table ── -->
        <rect x="30" y="108" width="120" height="6" rx="3" fill="rgba(255,255,255,0.25)"/>
        <rect x="42" y="114" width="8" height="18" rx="2" fill="rgba(255,255,255,0.15)"/>
        <rect x="130" y="114" width="8" height="18" rx="2" fill="rgba(255,255,255,0.15)"/>

        <!-- ── laptop base ── -->
        <rect x="52" y="90" width="76" height="18" rx="4" fill="rgba(255,255,255,0.30)"/>
        <!-- laptop hinge -->
        <rect x="86" y="88" width="8" height="4" rx="1" fill="rgba(255,255,255,0.45)"/>
        <!-- laptop screen -->
        <rect x="56" y="44" width="68" height="46" rx="5" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>
        <!-- screen glow -->
        <rect x="60" y="48" width="60" height="38" rx="3" fill="rgba(255,255,255,0.12)"/>
        <!-- screen content lines -->
        <rect x="66" y="55" width="36" height="3" rx="1.5" fill="rgba(255,255,255,0.55)"/>
        <rect x="66" y="62" width="48" height="2" rx="1" fill="rgba(255,255,255,0.35)"/>
        <rect x="66" y="68" width="40" height="2" rx="1" fill="rgba(255,255,255,0.35)"/>
        <rect x="66" y="74" width="44" height="2" rx="1" fill="rgba(255,255,255,0.25)"/>
        <!-- keyboard dots -->
        <rect x="58" y="95" width="64" height="3" rx="1.5" fill="rgba(255,255,255,0.20)"/>

        <!-- ── person body ── -->
        <!-- torso -->
        <path d="M72 80 Q90 75 108 80 L104 108 H76 Z" fill="rgba(255,255,255,0.35)"/>
        <!-- left arm reaching to keyboard -->
        <path d="M72 84 Q60 92 58 99" stroke="rgba(255,255,255,0.7)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <!-- right arm reaching to keyboard -->
        <path d="M108 84 Q120 92 122 99" stroke="rgba(255,255,255,0.7)" stroke-width="7" stroke-linecap="round" fill="none"/>
        <!-- left hand -->
        <circle cx="57" cy="101" r="4" fill="rgba(255,255,255,0.55)"/>
        <!-- right hand -->
        <circle cx="123" cy="101" r="4" fill="rgba(255,255,255,0.55)"/>
        <!-- neck -->
        <rect x="86" y="62" width="8" height="10" rx="3" fill="rgba(255,255,255,0.55)"/>
        <!-- head -->
        <circle cx="90" cy="52" r="14" fill="rgba(255,255,255,0.65)"/>
        <!-- hair -->
        <path d="M77 50 Q80 36 90 38 Q100 36 103 50" fill="rgba(255,255,255,0.4)"/>
        <!-- face — eyes -->
        <circle cx="85" cy="51" r="1.8" fill="rgba(22,100,60,0.6)"/>
        <circle cx="95" cy="51" r="1.8" fill="rgba(22,100,60,0.6)"/>
        <!-- face — smile -->
        <path d="M85 57 Q90 61 95 57" stroke="rgba(22,100,60,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

        <!-- ── floating badge: checkmark ── -->
        <rect x="6" y="28" width="38" height="24" rx="6" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
        <polyline points="14,40 20,46 32,34" stroke="rgba(255,255,255,0.9)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="12" y="56" width="26" height="2" rx="1" fill="rgba(255,255,255,0.25)"/>
        <rect x="16" y="60" width="18" height="2" rx="1" fill="rgba(255,255,255,0.18)"/>

        <!-- ── floating badge: document ── -->
        <rect x="136" y="20" width="36" height="44" rx="5" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
        <rect x="142" y="28" width="24" height="2.5" rx="1.2" fill="rgba(255,255,255,0.6)"/>
        <rect x="142" y="34" width="20" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
        <rect x="142" y="39" width="22" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
        <rect x="142" y="44" width="16" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>
        <rect x="142" y="49" width="18" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>

        <!-- ── small star sparkles ── -->
        <circle cx="28" cy="18" r="2.5" fill="rgba(255,255,255,0.5)"/>
        <circle cx="152" cy="14" r="2" fill="rgba(255,255,255,0.4)"/>
        <circle cx="164" cy="78" r="1.8" fill="rgba(255,255,255,0.35)"/>
        <circle cx="16" cy="78" r="1.5" fill="rgba(255,255,255,0.3)"/>
      </svg>

      <h2>Trusted Legal Services at Your Fingertips</h2>
      <p>Instant registrations, filings &amp; compliance — trusted by thousands of businesses across India.</p>
    </div>

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

</div>

<script>
  function togglePw() {
    const input = document.getElementById('password');
    const show  = document.getElementById('iconShow');
    const hide  = document.getElementById('iconHide');

    if (input.type === 'password') {
      input.type = 'text';
      show.style.display = 'none';
      hide.style.display = 'block';
    } else {
      input.type = 'password';
      show.style.display = 'block';
      hide.style.display = 'none';
    }
  }
</script>

</body>
</html>
