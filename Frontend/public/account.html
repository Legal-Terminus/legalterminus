<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account — Legal Terminus</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px 16px;
    }

    .card {
      display: flex;
      width: min(960px, 96vw);
      min-height: 560px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.14);
    }

    /* LEFT: brand panel */
    .brand-panel {
      flex: 0 0 38%;
      background: linear-gradient(145deg, #16a34a 0%, #15803d 55%, #166534 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 52px 40px;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    .brand-panel::before {
      content: '';
      position: absolute;
      width: 340px; height: 340px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      top: -110px; right: -110px;
    }

    .brand-panel::after {
      content: '';
      position: absolute;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      bottom: -70px; left: -60px;
    }

    .logo-area {
      z-index: 1;
      background: #ffffff;
      border-radius: 14px;
      padding: 10px 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.15);
      margin-bottom: 40px;
    }

    .logo-gif { height: 58px; width: auto; display: block; }

    .avatar-circle {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      border: 3px solid rgba(255,255,255,.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 700; color: #fff;
      margin-bottom: 16px; z-index: 1;
      text-transform: uppercase;
    }

    .brand-name {
      font-size: 20px; font-weight: 700; letter-spacing: -.2px;
      z-index: 1; text-align: center; margin-bottom: 6px;
    }

    .brand-email {
      font-size: 13px; color: rgba(255,255,255,.75);
      z-index: 1; text-align: center; word-break: break-all;
    }

    .brand-tagline {
      font-size: 12px; color: rgba(255,255,255,.55);
      z-index: 1; text-align: center; margin-top: 18px; line-height: 1.5;
    }

    /* RIGHT: details panel */
    .details-panel {
      flex: 1;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 52px 48px;
    }

    .details-panel h1 {
      font-size: 26px; font-weight: 700; color: #0f1724;
      margin-bottom: 6px; letter-spacing: -.3px;
    }

    .details-panel .sub {
      font-size: 14px; color: #6b7280; margin-bottom: 36px;
    }

    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid #f1f5f1;
    }
    .detail-row:last-of-type { border-bottom: none; }

    .detail-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: #f0fdf4; border: 1px solid #bbf7d0;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .detail-icon svg { width: 18px; height: 18px; fill: #16a34a; }

    .detail-label {
      font-size: 11px; font-weight: 600; color: #9ca3af;
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 3px;
    }

    .detail-value {
      font-size: 15px; font-weight: 600; color: #111827;
    }

    .actions {
      display: flex; gap: 12px; margin-top: 36px; flex-wrap: wrap;
    }

    .btn-home {
      flex: 1; min-width: 120px; height: 46px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; text-decoration: none;
      transition: opacity .2s, transform .15s;
    }
    .btn-home:hover { opacity: .9; transform: translateY(-1px); }

    .btn-logout {
      flex: 1; min-width: 120px; height: 46px;
      background: #fff; color: #dc2626;
      border: 1.5px solid #fca5a5; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px;
      transition: background .2s, transform .15s;
    }
    .btn-logout:hover { background: #fff1f1; transform: translateY(-1px); }

    @media (max-width: 640px) {
      .card { flex-direction: column; }
      .brand-panel { flex: none; padding: 36px 28px; min-height: 200px; }
      .details-panel { padding: 36px 28px; }
    }
  </style>
</head>
<body>

<div class="card">
  <!-- LEFT brand panel -->
  <div class="brand-panel">
    <div class="logo-area">
      <img
        src="/logo-animated.gif"
        onerror="this.src='https://legalterminus.com/wp-content/uploads/2023/09/Legal-Terminus-LOGO-GIF_300-x-150.gif'"
        alt="Legal Terminus"
        class="logo-gif"
      />
    </div>
    <div class="avatar-circle" id="avatarInitial">?</div>
    <div class="brand-name" id="panelName">—</div>
    <div class="brand-email" id="panelEmail">—</div>
    <div class="brand-tagline">Welcome back!<br>Manage your Legal Terminus account below.</div>
  </div>

  <!-- RIGHT details panel -->
  <div class="details-panel">
    <h1>My Account</h1>
    <p class="sub">Your registered account details</p>

    <div class="detail-row">
      <div class="detail-icon">
        <!-- person icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5.33 0-8 2.67-8 4v1h16v-1c0-1.33-2.67-4-8-4z"/>
        </svg>
      </div>
      <div>
        <div class="detail-label">Full Name</div>
        <div class="detail-value" id="detailName">—</div>
      </div>
    </div>

    <div class="detail-row">
      <div class="detail-icon">
        <!-- email icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </div>
      <div>
        <div class="detail-label">Email Address</div>
        <div class="detail-value" id="detailEmail">—</div>
      </div>
    </div>

    <div class="detail-row">
      <div class="detail-icon">
        <!-- phone icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
        </svg>
      </div>
      <div>
        <div class="detail-label">Phone Number</div>
        <div class="detail-value" id="detailPhone">—</div>
      </div>
    </div>

    <div class="actions">
      <a href="/" class="btn-home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Go to Website
      </a>
      <button class="btn-logout" onclick="handleLogout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        Logout
      </button>
    </div>
  </div>
</div>

<script>
  const raw = localStorage.getItem('lt_logged_in');
  if (!raw) {
    window.location.href = '/login';
  } else {
    const user = JSON.parse(raw);

    // Avatar initial
    document.getElementById('avatarInitial').textContent = (user.name || '?').charAt(0).toUpperCase();

    // Panel
    document.getElementById('panelName').textContent  = user.name  || '—';
    document.getElementById('panelEmail').textContent = user.email || '—';

    // Detail rows
    document.getElementById('detailName').textContent  = user.name  || '—';
    document.getElementById('detailEmail').textContent = user.email || '—';
    document.getElementById('detailPhone').textContent = user.phone ? ('+91 ' + user.phone) : '—';
  }

  function handleLogout() {
    localStorage.removeItem('lt_logged_in');
    window.location.href = '/';
  }
</script>
</body>
</html>
